<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แฟ้มสะสมผลงาน | ระบบการเรียนรู้กับครูเจอาร์</title>
<meta name="description" content="แฟ้มสะสมผลงานและศูนย์ข่าวประชาสัมพันธ์ ครูปฎิภาณ พานทอง (ครูเจอาร์) แผนกวิชาคอมพิวเตอร์และเทคโนโลยีธุรกิจดิจิทัล วิทยาลัยการอาชีพโพนทอง">
<meta property="og:title" content="แฟ้มสะสมผลงาน | ระบบการเรียนรู้กับครูเจอาร์">
<meta property="og:description" content="ผลงาน รายวิชา ข่าวสาร และช่องทางติดต่อครูเจอาร์">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fbbf24'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='26' font-weight='700' text-anchor='middle' fill='%230b1b2b'%3EJR%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #060f1a; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    color: #22d3ee; font: 14px ui-monospace, monospace; transition: opacity .4s; }
  #loading .logo { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg,#fbbf24,#d97706);
    color: #0b1b2b; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; animation: p 1.4s infinite; }
  #loading a { color: #fbbf24; font-family: system-ui, sans-serif; font-size: 13px; }
  @keyframes p { 50% { opacity: .55; } }
</style>
</head>
<body>
<div id="loading">
  <div class="logo">JR</div>
  <div>loading portfolio…</div>
  <a id="direct" href="#" target="_top">เปิดเว็บไซต์โดยตรง</a>
</div>
<iframe id="app" title="แฟ้มสะสมผลงาน ครูเจอาร์" allow="clipboard-write; fullscreen"></iframe>
<script>
  // เว็บแอปจริง (Google Apps Script) — เปลี่ยนลิงก์ที่นี่ที่เดียวถ้ามีการ Deploy ใหม่เป็น URL อื่น
  var APP_URL = 'https://script.google.com/macros/s/AKfycbza7Cn08SrAGthanMoSgouXyE8HdsvyW7LfJka3Qajtm8U24FE-WZ4ktOzSargxZuLafA/exec';
  document.getElementById('direct').href = APP_URL;
  var f = document.getElementById('app');
  f.onload = function () { var l = document.getElementById('loading'); l.style.opacity = 0; setTimeout(function () { l.style.display = 'none'; }, 400); };
  f.src = APP_URL;
</script>
</body>
</html>
